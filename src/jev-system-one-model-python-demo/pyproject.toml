[project]
name = "zazencodes-jev-demo"
version = "0.1.0"
description = "Hands-on implementation of TypeSafe AI's Jev (System One AI model) for ultra-fast agent routing, guardrails, and calibrated decision-making."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
